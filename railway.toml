# Railway — deploy del submódulo backend (repo standalone)
# Guía: DEPLOY_RAILWAY.md
#
# En Railway: conecta el repo del submódulo backend, Root Directory = /

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "**/*.py",
  "pyproject.toml",
  "uv.lock",
  "Dockerfile",
  "entrypoint.sh",
  "railway.toml",
]

[deploy]
healthcheckPath = "/api/v1/docs/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Railway reemplaza CMD y a menudo no invoca ENTRYPOINT: envolver con /entrypoint.sh
startCommand = "/entrypoint.sh sh -c 'uv run daphne -b 0.0.0.0 -p ${PORT:-8000} core.asgi:application'"
